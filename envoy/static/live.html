<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meridian Swarm</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f7f8;--panel:#ffffff;--line:#e4e4e7;--line2:#f0f0f2;--ink:#09090b;--mute:#71717a;--acc:#1d4ed8;--acc2:#dbeafe;--ok:#15803d;--ok2:#dcfce7;--bad:#b91c1c;--bad2:#fee2e2;--warn:#b45309;--warn2:#fef3c7;--gold:#a16207;--gold2:#fef9c3;--vio:#6d28d9;--vio2:#ede9fe;--mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;--sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--sh:0 1px 2px rgba(9,9,11,.04),0 1px 3px rgba(9,9,11,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#09090b;--panel:#111113;--line:#27272a;--line2:#1c1c1f;--ink:#fafafa;--mute:#a1a1aa;--acc:#60a5fa;--acc2:#172554;--ok:#4ade80;--ok2:#052e16;--bad:#f87171;--bad2:#450a0a;--warn:#fbbf24;--warn2:#451a03;--gold:#facc15;--gold2:#422006;--vio:#c4b5fd;--vio2:#2e1065;--sh:none}}
:root[data-theme="dark"]{--bg:#09090b;--panel:#111113;--line:#27272a;--line2:#1c1c1f;--ink:#fafafa;--mute:#a1a1aa;--acc:#60a5fa;--acc2:#172554;--ok:#4ade80;--ok2:#052e16;--bad:#f87171;--bad2:#450a0a;--warn:#fbbf24;--warn2:#451a03;--gold:#facc15;--gold2:#422006;--vio:#c4b5fd;--vio2:#2e1065;--sh:none}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:13.5px/1.45 var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}body{display:flex;flex-direction:column}
#top{display:flex;gap:8px;align-items:center;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
#top b{font-weight:600;font-size:13px;letter-spacing:.12em;margin-right:10px}.grp{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--panel);box-shadow:var(--sh)}.grp>label{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);padding:0 8px 0 10px;font-weight:600;white-space:nowrap}.grp>select,.grp>input{border:0;box-shadow:none;border-left:1px solid var(--line);border-radius:0 8px 8px 0;background:transparent}.grp>select:focus,.grp>input:focus{outline:none}
input,select,button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 11px;box-shadow:var(--sh)}
input:focus,select:focus{outline:2px solid var(--acc2);border-color:var(--acc)}
#q{flex:1;min-width:160px}button{cursor:pointer;font-weight:500}button.go{background:var(--ink);border-color:var(--ink);color:var(--bg);white-space:nowrap}button:disabled{opacity:.4}
#steps{display:flex;gap:4px;padding:8px 18px 0;height:14px}#steps span{flex:1;height:3px;background:var(--line);border-radius:2px;transition:background .4s}#steps span.on{background:var(--acc)}#steps span.done{background:var(--ink)}
#wrap{display:grid;grid-template-columns:1.35fr 1fr;flex:1;min-height:0}
#left{position:relative;border-right:1px solid var(--line);background:var(--panel);background-image:radial-gradient(var(--line) .8px,transparent .8px);background-size:22px 22px}canvas{display:block;width:100%;height:100%}
#banner{position:absolute;left:18px;top:16px;max-width:460px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;box-shadow:var(--sh)}#banner b{font-family:var(--mono);color:var(--mute);font-size:11px;letter-spacing:.08em}#banner h3{margin:2px 0 4px;font-size:16px;font-weight:600}#banner p{margin:0;color:var(--mute);font-size:13px;line-height:1.45}
#cap{position:absolute;left:18px;right:18px;bottom:14px;font-size:13.5px;color:var(--ink);opacity:0;transition:opacity .3s;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;box-shadow:var(--sh)}#cap.on{opacity:1}#cap small{color:var(--mute);display:block;font-size:12px;margin-top:1px}
#right{padding:16px 18px;overflow:auto;background:var(--bg)}
#right h2{margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em}#right h2 b{color:var(--mute);font-family:var(--mono);font-weight:500;margin-right:8px;font-size:12px}#right .sub{color:var(--mute);font-size:12.5px;margin:3px 0 12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;animation:in .3s;box-shadow:var(--sh)}
@keyframes in{from{transform:translateY(4px)}to{transform:none}}
.lab{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:0 0 8px;font-weight:600}
.bar{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:12.5px}.bar .t{width:150px;color:var(--mute)}.bar.win .t{color:var(--ink);font-weight:600}.bar .b{flex:1;height:8px;background:var(--line2);border-radius:4px;overflow:hidden}.bar .b i{display:block;height:100%;background:var(--acc)}.bar .v{width:40px;text-align:right;font-family:var(--mono);font-size:11.5px}
.chip{display:inline-block;font-size:11px;font-weight:500;padding:2px 8px;border-radius:6px;border:1px solid var(--line);margin:2px 4px 2px 0;color:var(--mute);background:var(--panel)}
.chip.ok{border-color:transparent;background:var(--ok2);color:var(--ok)}.chip.bad{border-color:transparent;background:var(--bad2);color:var(--bad)}.chip.warn{border-color:transparent;background:var(--warn2);color:var(--warn)}.chip.acc{border-color:transparent;background:var(--acc2);color:var(--acc)}.chip.gold{border-color:transparent;background:var(--gold2);color:var(--gold)}.chip.vio{border-color:transparent;background:var(--vio2);color:var(--vio)}
.num{font-family:var(--mono);font-size:12px}.mute{color:var(--mute)}.small{font-size:12.5px}
.bid{display:grid;grid-template-columns:1fr auto;gap:6px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;margin:6px 0;background:var(--panel)}.bid.won{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok) inset}.bid.lost{opacity:.5}.bid b{font-size:13px;font-weight:600}
.feed{font-family:var(--mono);font-size:11.5px}.feed div{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--line2);animation:in .3s;align-items:center}.feed .ok{color:var(--ok);font-weight:600;width:62px}.feed .no{color:var(--bad);font-weight:600;width:62px}.feed .x{color:var(--gold);font-weight:600;width:62px}.feed a{color:var(--acc);text-decoration:none}
.vc{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 11px;border:1px solid var(--line);border-radius:9px;margin:6px 0;background:var(--panel)}.vc .id{font-family:var(--mono);font-weight:600;font-size:12px}.vc .arrow{font-family:var(--mono);font-size:12px;white-space:nowrap}
.v-supported{color:var(--ok);font-weight:600}.v-not_supported{color:var(--bad);font-weight:600}.v-inconsistent{color:var(--warn);font-weight:600}.v-inconclusive{color:var(--mute);font-weight:600}
.dots i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:3px}
.heat{border-collapse:separate;border-spacing:2px;font-family:var(--mono);font-size:11px;width:100%;table-layout:fixed}.heat th{font-weight:500;color:var(--mute);padding:3px 1px;text-align:center;font-size:9.5px;font-family:var(--sans);line-height:1.1}.heat th:first-child{width:28px}.heat td{text-align:center;padding:5px 2px;border-radius:4px;background:var(--line2)}
.kpi{display:flex;gap:0;border-top:1px solid var(--line);background:var(--panel);font-family:var(--mono);font-size:11px;color:var(--mute)}.kpi>div{flex:1;padding:10px 18px;border-right:1px solid var(--line)}.kpi b{display:block;color:var(--ink);font-size:16px;font-weight:600;margin-bottom:1px}
details summary{cursor:pointer;color:var(--mute);font-size:12.5px}details p{font-size:13px;margin:6px 0}
svg text{font-family:var(--mono);font-size:10.5px;fill:var(--ink)}
.spin:before{content:"";display:inline-block;width:9px;height:9px;border:2px solid var(--acc);border-right-color:transparent;border-radius:50%;margin-right:7px;animation:sp .8s linear infinite;vertical-align:-1px}@keyframes sp{to{transform:rotate(360deg)}}
.present #top .grp,.present #top button.go{display:none}.present #top:after{content:'';flex:1}.present #banner{max-width:560px;padding:16px 18px}.present #banner h3{font-size:22px}.present #banner p{font-size:15px;color:var(--ink)}.present #cap{font-size:15px}.present #right .small.mute:not(.naive),.present #right .sub,.present #right details,.present .kpi>div:nth-child(2),.present .kpi>div:nth-child(3),.present .kpi>div:nth-child(5){display:none}.present #right h2{font-size:17px}.present .kpi b{font-size:20px}
</style>
</head>
<body>
<div id="top"><b id="brand">MERIDIAN</b><div class="grp" style="flex:1"><label>Question</label><select id="demo"><option value="">custom…</option></select><input id="q" placeholder="type a research question" style="flex:1"></div><div class="grp"><label>Home lab</label><select id="home"></select></div><div class="grp"><label>Panel</label><select id="mode"><option value="fast">code review · fast</option><option value="deep">LLM debate · deep</option></select></div><button class="go" id="run">Run live</button><div class="grp"><label>Replay</label><select id="replay"><option value="">recorded run…</option></select></div></div>
<div id="steps"></div>
<div id="wrap">
  <div id="left"><canvas id="c"></canvas><div id="banner"><b>00</b><h3>The network</h3><p>Four labs. Each keeps its data behind its own gate.</p></div><div id="cap"><span id="capt"></span><small id="caps"></small></div></div>
  <div id="right"><h2 id="h2"><b>0</b>The network</h2><div class="sub" id="sub">Each lab holds its own data behind a gate. Only questions, bids, aggregates and payments move.</div><div id="panel"></div></div>
</div>
<div class="kpi"><div><b id="k0">0</b>rows of data moved</div><div><b id="k1">0</b>gated queries</div><div><b id="k2">0</b>refused · not charged</div><div><b id="k3">$0.00</b>paid · x402</div><div><b id="k4">0</b>language-model calls</div><div><b id="k5">–</b>audit chain</div></div>
<script>
var $=function(i){return document.getElementById(i)};
window.addEventListener('error',function(e){try{var c=$('cap');c.className='on';$('capt').textContent='UI error: '+e.message;$('caps').textContent=(e.filename||'')+':'+e.lineno}catch(x){}});
window.addEventListener('unhandledrejection',function(e){try{var c=$('cap');c.className='on';$('capt').textContent='UI error: '+(e.reason&&e.reason.message||e.reason)}catch(x){}});
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function f2(x){return x==null||isNaN(x)?'–':Number(x).toFixed(2)}function money(x){return '$'+Number(x||0).toFixed(2)}
function vcl(v){return '<span class="v-'+v+'">'+esc(String(v).replace('_',' '))+'</span>'}
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
var C={};function colors(){['ink','mute','line','acc','ok','bad','warn','gold','vio','bg','panel'].forEach(function(k){C[k]=css('--'+k)})}colors();matchMedia('(prefers-color-scheme: dark)').addEventListener('change',colors);
var VC=function(v){return {supported:C.ok,not_supported:C.bad,inconsistent:C.warn,inconclusive:C.mute}[v]||C.mute};
var LABS={},DEMOS=[],RUN;
var RECIPE={event_mix_comparison:'stroke vs heart-attack mix',age_gradient:'hypertension → stroke, by age',undiagnosed_comparison:'undiagnosed high blood pressure',unsupported:'not supported'};var WHY={min_cases:'too few cases',min_population:'group too small',min_cell_all_strata:'cells too small',overlap_detected:'overlapping query',budget_exhausted:'budget used up',variable_unavailable:'no such measurement',group_unavailable:'no such group',sla_failure:'lab failed to answer',payment_failed:'payment did not settle · retried · not charged'};function why(c){return WHY[c]||String(c||'').replace(/_/g,' ')}
function ids(t){return String(t).replace(/[A-Z]+_[A-Z]+_\d{4}/g,function(m){return short(m)}).replace(/\(I\^2\)/,'')}
function short(id){return ((LABS[id]||{}).country||id).replace('United States','USA').replace('South Korea','Korea')}
/* ================= swarm canvas ================= */
var cv=$('c'),cx=cv.getContext('2d'),DPR=devicePixelRatio||1,W=0,H=0,T=0;
function resize(){W=cv.clientWidth;H=cv.clientHeight;cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0);place()}
addEventListener('resize',resize);
var N={},P=[],L=[];  /* nodes, packets, links */
function place(){var labs=Object.values(N).filter(function(n){return n.kind==='lab'});if(N.HOME){N.HOME.x=W*0.2;N.HOME.y=H*0.46}
 labs.forEach(function(n,i){var a=(i-(labs.length-1)/2)*0.55;n.x=W*0.78-Math.cos(a)*W*0.04;n.y=H*0.46+Math.sin(a)*H*0.36});
 if(N.POOL){N.POOL.x=W*0.5;N.POOL.y=H*0.46}var lens=Object.values(N).filter(function(n){return n.kind==='lens'});lens.forEach(function(n,i){n.x=W*0.5+(i-1)*W*0.09;n.y=H*0.80});if(N.HUMAN){N.HUMAN.x=W*0.5;N.HUMAN.y=H*0.12}}
function node(id,o){var n=N[id]||(N[id]={id:id,x:W/2,y:H/2,r:16,born:T,color:C.mute,label:'',sub:'',ring:null,flash:0,flashColor:C.ok,dim:false,glyph:''});Object.assign(n,o);place();return n}
function link(a,b,o){var l=Object.assign({a:a,b:b,color:C.line,dash:true,w:1,born:T},o||{});L.push(l);return l}
function packet(a,b,o){var p=Object.assign({a:a,b:b,t:0,speed:1/0.9,color:C.acc,size:4,kind:'dot',bend:0.18},o||{});P.push(p);return p}
function curve(a,b,bend){var mx=(a.x+b.x)/2,my=(a.y+b.y)/2,dx=b.x-a.x,dy=b.y-a.y;return [mx-dy*bend,my+dx*bend]}
function qp(a,c,b,t){var u=1-t;return [u*u*a.x+2*u*t*c[0]+t*t*b.x,u*u*a.y+2*u*t*c[1]+t*t*b.y]}
function draw(){T+=1/60;cx.clearRect(0,0,W,H);
 L.forEach(function(l){var a=N[l.a],b=N[l.b];if(!a||!b){return}var c=curve(a,b,0.12),age=Math.min(1,(T-l.born)/0.5);cx.globalAlpha=age*(l.dash?0.35:0.8);cx.strokeStyle=l.color;cx.lineWidth=l.w;cx.setLineDash(l.dash?[4,7]:[]);cx.beginPath();cx.moveTo(a.x,a.y);cx.quadraticCurveTo(c[0],c[1],b.x,b.y);cx.stroke();cx.setLineDash([])});
 for(var i=P.length-1;i>=0;i--){var p=P[i],a=N[p.a],b=N[p.b];if(!a||!b){P.splice(i,1);continue}p.t+=p.speed/60;var c=curve(a,b,p.bend),q=qp(a,c,b,Math.min(1,p.t));
  cx.globalAlpha=1;if(p.kind==='coin'){cx.fillStyle=C.gold;cx.beginPath();cx.arc(q[0],q[1],6,0,7);cx.fill();cx.fillStyle='#000';cx.font='bold 8px '+css('--mono');cx.textAlign='center';cx.textBaseline='middle';cx.fillText('$',q[0],q[1]+.5)}
  else if(p.kind==='agg'){cx.fillStyle=C.ok;cx.font='bold 13px '+css('--mono');cx.textAlign='center';cx.textBaseline='middle';cx.fillText('Σ',q[0],q[1])}
  else if(p.kind==='bounce'){cx.strokeStyle=C.bad;cx.lineWidth=2;cx.beginPath();cx.arc(q[0],q[1],5,0,7);cx.stroke()}
  else{cx.fillStyle=p.color;cx.beginPath();cx.arc(q[0],q[1],p.size,0,7);cx.fill();var tr=cx.createLinearGradient(q[0],q[1],a.x,a.y);}
  if(p.t>=1){P.splice(i,1);if(p.onArrive){p.onArrive()}}}
 Object.values(N).forEach(function(n){var age=Math.min(1,(T-n.born)/0.5),r=n.r*(0.7+0.3*age);cx.globalAlpha=n.dim?0.3:age;
  if(n.kind==='lab'||n.kind==='home'){var fl=Math.max(0,n.flash-(T-n.flashAt||0)*1.2);cx.strokeStyle=fl>0?n.flashColor:(n.gateColor||C.line);cx.lineWidth=fl>0?3+fl*3:1.5;cx.setLineDash(fl>0?[]:[3,5]);cx.beginPath();cx.arc(n.x,n.y,r+12,0,7);cx.stroke();cx.setLineDash([]);
   if(fl>0){cx.globalAlpha*=fl*0.5;cx.fillStyle=n.flashColor;cx.beginPath();cx.arc(n.x,n.y,r+12,0,7);cx.fill();cx.globalAlpha=n.dim?0.3:age}}
  cx.fillStyle=C.panel;cx.beginPath();cx.arc(n.x,n.y,r,0,7);cx.fill();cx.lineWidth=2;cx.strokeStyle=n.color;cx.stroke();
  if(n.fill){cx.fillStyle=n.color;cx.beginPath();cx.arc(n.x,n.y,r-3,0,7);cx.fill()}
  cx.fillStyle=n.fill?C.bg:n.color;cx.font='600 '+(n.kind==='lab'||n.kind==='home'?'13px ':'11px ')+css('--mono');cx.textAlign='center';cx.textBaseline='middle';cx.fillText(n.glyph,n.x,n.y+.5);
  cx.fillStyle=C.ink;cx.font='600 12px '+css('--sans');cx.fillText(n.label,n.x,n.y+r+22);if(n.sub){cx.fillStyle=C.mute;cx.font='11px '+css('--mono');cx.fillText(n.sub,n.x,n.y+r+36)}if(n.sub2){cx.fillStyle=n.sub2Color||C.mute;cx.font='11px '+css('--mono');cx.fillText(n.sub2,n.x,n.y+r+50)}
  if(n.dots){var x0=n.x-(n.dots.length-1)*7;n.dots.forEach(function(d,i){cx.fillStyle=d;cx.beginPath();cx.arc(x0+i*14,n.y-r-12,5,0,7);cx.fill()})}});
 cx.globalAlpha=1;requestAnimationFrame(draw)}
requestAnimationFrame(draw);
function flash(id,color){var n=N[id];if(n){n.flash=1;n.flashAt=T;n.flashColor=color}}
var tipEl=null;cv.addEventListener('click',function(e){var r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;Object.values(N).forEach(function(n){if(Math.hypot(n.x-x,n.y-y)<n.r+12&&n.href){open(n.href,'_blank')}if(n.id==='HUMAN'&&Math.hypot(n.x-x,n.y-y)<n.r+12){$('panel').scrollIntoView()}})});
function caption(t,s){$('capt').textContent=t;$('caps').textContent=s||'';$('cap').className='on'}
/* ================= right panel ================= */
var STORY={0:['Four health databases in three countries','None of them may share a single patient record. Each one sits behind its own locked gate.'],1:['A researcher in Korea asks a question','Is high blood pressure a bigger stroke risk in young adults? Korea alone has too few young stroke cases. The system works out what Korea can answer itself, and what needs other countries.'],2:['Labs that could help bid for the job','Each one proves it can answer by test-running its own gate, then bids with a price and a track record the platform computed. Two are hired. No sales pitch counts.'],3:['The plan is locked before any data is touched','It is fingerprinted. Nobody can move the goalposts after seeing the results.'],4:['Each lab answers from behind its gate','Only summary counts leave, never a person. Korea\'s own gate refuses its own researcher: too few people to protect. The others answer and are paid per answer, automatically.'],5:['The summaries are combined with fixed statistics','Young adults: four times the odds of stroke. Over 65: the labs disagree, so the system refuses to average them into a false consensus.'],6:['Three independent reviewers vote on every claim','Not the labs: a methodologist, a clinician and an ethics reviewer built into the platform. Each votes to keep the verdict the statistics allow, or to make it more cautious. Votes are scored from eight weaknesses and come with their reasons.'],7:['The write-up is produced by code','The language model may only reword it, with countries hidden, and a guard checks every number and verdict.'],8:['Verdicts, the record, a signature','What a normal analysis would have said is shown struck through. Every step is fingerprinted into a chain. A human signs.'],9:['Did the bias checks work?','We plant bias in synthetic labs where we know the truth and watch the same system catch it.'],10:['The audit trail','Every step, in order, each line fingerprinting the one before. Change one value and the chain breaks.'],11:['A human signs','Nothing is a conclusion until a qualified person accepts it.']};
var PRESENT=new URLSearchParams(location.search).get('present')==='1';

 if(view==='verdicts'){stage(8,'','',nav+'<div class="card">'+(r.verdicts||[]).map(function(v){return '<div class="vc"><span class="id">'+v.claim_id+'</span><span class="small">'+esc(v.statement)+'<br><span class="mute">'+esc((v.certainty||{}).level&&v.certainty.level!=='not graded'?'how much to trust it: '+v.certainty.level:'')+'</span></span><span class="arrow">'+vcl(v.ceiling)+(v.final!==v.ceiling?' → '+vcl(v.final):'')+(v.human_review_required?'<br><span class="chip warn">review</span>':'')+((v.naive||{}).differs?'<br><span class="small naive">a normal analysis: <s>'+esc(v.naive.verdict.replace('_',' '))+'</s></span>':'')+'</span></div>'+((v.naive||{}).differs?'<div class="small naive" style="margin:-2px 0 8px 11px;color:var(--warn)">'+esc(v.naive.why)+'</div>':'')}).join('')+'</div>'+
  '<div class="card"><p class="lab">Summary · '+(g.length?'<span class="chip warn">model rewrite rejected, code version shown</span>':'<span class="chip ok">model reword accepted by the guard</span>')+'</p><div class="small"><b>'+esc(nr.headline)+'</b></div><details><summary>full summary</summary>'+(nr.summary||[]).map(function(t){return '<p>'+esc(t)+'</p>'}).join('')+(g.length?'<p class="mute">why the rewrite was rejected: '+esc(g.join('; '))+'</p>':'')+'</details></div>');
  $('h2').innerHTML='<b>08</b>Verdicts';$('sub').textContent='Statistics set the ceiling; the review can only lower it. A struck-through word shows what a normal analysis would have said.'}
 else if(view==='bias'){var nd=(r.verdicts||[]).filter(function(v){return (v.naive||{}).differs}).length;
  stage(8,'','',nav+'<div class="card"><p class="lab">On this run</p>'+(nd?'<span class="chip warn">'+nd+' of '+r.verdicts.length+' verdicts differ from a normal analysis</span>':'<span class="chip ok">a normal analysis would agree on every verdict</span>')+(r.invariance?(r.invariance.name_swap_identical?'<span class="chip ok">rename every lab → identical votes</span>':'<span class="chip bad">renaming labs changed votes</span>'):'')+'</div>'+
  '<div class="card"><p class="lab">Plant bias and see if it is caught</p><div class="small mute" style="margin-bottom:8px">Synthetic labs with a truth we chose, through the same gate and statistics. Synthetic data only.</div><button class="go" id="plant">Plant bias now</button><div id="bench"></div></div>');
  $('h2').innerHTML='<b>09</b>Did the bias checks work?';$('sub').textContent='Two tests: what a normal analysis would have concluded from the same numbers, and whether planted bias gets caught.';$('banner').innerHTML='<b>09</b><h3>'+STORY[9][0]+'</h3><p>'+STORY[9][1]+'</p>';
  $('plant').addEventListener('click',async function(){var b=$('bench');b.innerHTML='<p class="spin small mute">planting bias in 6 scenarios × 60 trials…</p>';caption('Planting bias in synthetic twins','we know the truth → does the same gate and statistics catch it?');
   var j=await (await fetch('/bias_benchmark?trials=60',{method:'POST'})).json();var tr=j.transport||[],sg=j.small_group||{},pv=j.privacy||{};
   b.innerHTML='<p class="lab" style="margin-top:12px">Evidence that does NOT transfer (2× difference): how often it was caught</p>'+tr.filter(function(x){return x.true_ratio===2}).map(function(x){var fa=tr.find(function(y){return y.true_ratio===1&&y.minority_n===x.minority_n})||{};return '<div class="bar"><span class="t">minority of '+x.minority_n.toLocaleString()+' people</span><span class="b"><i style="width:'+Math.round((x.rate||0)*100)+'%;background:var(--ok)"></i></span><span class="v">'+Math.round((x.rate||0)*100)+'%</span><span class="small mute" style="width:120px">false alarms '+Math.round((fa.rate||0)*100)+'%</span></div>'}).join('')+
   '<p class="lab" style="margin-top:12px">A small group gets an answer</p><div class="bar"><span class="t">its own lab alone</span><span class="b"><i style="width:'+Math.round(sg.alone_answered/sg.trials*100)+'%;background:var(--bad)"></i></span><span class="v">'+sg.alone_answered+'/'+sg.trials+'</span></div><div class="bar"><span class="t">through the network</span><span class="b"><i style="width:'+Math.round(sg.network_answered/sg.trials*100)+'%;background:var(--ok)"></i></span><span class="v">'+sg.network_answered+'/'+sg.trials+'</span></div><div class="small mute">and the pooled answer was right: '+sg.pooled_median_or+' vs truth '+sg.true_or+'</div>'+
   '<p class="lab" style="margin-top:12px">Privacy</p><span class="chip '+(pv.cells_below_policy||pv.estimates_below_policy?'bad':'ok')+'">'+pv.results_released.toLocaleString()+' answers released · '+(pv.cells_below_policy+pv.estimates_below_policy)+' broke the rules</span><span class="chip">'+j.seconds+' s</span>';
   caption('Planted bias caught '+Math.round(((tr.find(function(x){return x.true_ratio===2&&x.minority_n===1000})||{}).rate||0)*100)+'% of the time','0 of '+pv.results_released.toLocaleString()+' released answers broke the privacy rules')})}
 else if(view==='audit'){var a=RUN.audit||{chain:[],entries:0};
  stage(8,'','',nav+'<div class="card"><p class="lab">Every step, in order · each line carries the fingerprint of the one before</p><div class="feed" id="chain">'+chainHtml(a,null)+'</div><div class="row" style="margin-top:10px"><button id="verify">Verify</button><button id="tamper">Change one value in a copy</button><span class="small status" id="chainmsg"></span></div></div>');
  $('h2').innerHTML='<b>10</b>Audit trail';$('sub').textContent='The complete record of the run. Change anything and every later line breaks.';$('banner').innerHTML='<b>10</b><h3>'+STORY[10][0]+'</h3><p>'+STORY[10][1]+'</p>';
  $('verify').addEventListener('click',async function(){var x=await (await fetch('/runs/'+r.run_id+'/audit')).json();RUN.audit=x;$('chain').innerHTML=chainHtml(x,null);$('chainmsg').innerHTML='<span class="chip ok">valid · '+x.entries+' entries · every fingerprint matches</span>';$('k5').textContent='valid · '+x.entries;caption('Audit trail verified: '+x.entries+' entries, every fingerprint matches','the real log, re-checked line by line')});
  $('tamper').addEventListener('click',async function(){var n=Math.max(1,Math.floor(((RUN.audit||{}).entries||10)*0.5));var t=await (await fetch('/runs/'+r.run_id+'/audit/tamper?entry='+n)).json();$('chain').innerHTML=chainHtml(RUN.audit||{chain:[]},t.broken_at);$('chainmsg').innerHTML='<span class="chip bad">chain broken from line '+t.broken_at+'</span>';$('k5').textContent='BROKEN · copy';caption('One value changed → the chain breaks from line '+t.broken_at+' onwards','the stored log was not touched; this is a copy')})}
 else if(view==='sign'){stage(8,'','',nav+'<div class="card"><p class="lab">Human sign-off</p><div class="small" style="margin-bottom:10px">Nothing here is a conclusion until a qualified person signs. The signature joins the chain.</div><button class="go" data-d="accept">Accept and sign</button> <button data-d="challenge">Challenge</button> <button data-d="reject">Reject</button> <span class="small status" id="signed"></span></div>');
  $('h2').innerHTML='<b>11</b>Sign-off';$('sub').textContent='A human decides. Challenge freezes the run as disputed; nothing is published either way.';$('banner').innerHTML='<b>11</b><h3>'+STORY[11][0]+'</h3><p>'+STORY[11][1]+'</p>';
  $('panel').querySelector('.card').addEventListener('click',async function(e){var d=e.target.getAttribute('data-d');if(!d){return}var x=await (await fetch('/runs/'+r.run_id+'/signoff',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({decision:d,reviewer:'researcher',note:'signed from the live view'})})).json();
   $('signed').textContent=x.status+' · chain valid · '+(x.audit_chain||{}).entries+' entries';$('k5').textContent=(x.audit_chain&&x.audit_chain.valid?'valid':'BROKEN')+' · '+(x.audit_chain||{}).entries;var h=N.HUMAN;h.fill=true;h.color={accept:C.ok,challenge:C.warn,reject:C.bad}[d];h.sub=x.status;h.born=T;caption('Human '+x.status+' · the signature is now line '+((x.audit_chain||{}).entries-1)+' of the chain','')})}
}
$('panel').addEventListener('click',function(e){var v=e.target.getAttribute('data-view');if(v){showResult(v)}});

/* pacing: a 30 ms burst of events is played at human speed; the run itself is live */
var Q=[],busy=false;function push(e){Q.push(e);if(!busy){drain()}}
function drain(){if(!Q.length){busy=false;return}busy=true;var e=Q.shift();onEvent(e);var beat=e.kind==='lab'?1500:(e.kind==='stage'&&STAGE[e.stage]?2200:(e.kind==='vector_panel'?2600:120));if(PRESENT){beat*=1.5}setTimeout(drain,beat)}
/* run / replay */
var DEMOPREF={'2':['KOREA_KNHANES_2024'],'6':['US_BRFSS_2023','BRAZIL_PNS_2019'],'5':['US_NHANES_2017']};
async function run(){var q=$('q').value.trim(),home=$('home').value;if(!q){return}$('run').disabled=true;start(q,home);
 try{var res=await fetch('/runs/stream',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({question:q,home:home,mode:$('mode').value,budget_usd:10,preferred_labs:DEMOPREF[$('demo').value]||[]})});var rd=res.body.getReader(),dec=new TextDecoder(),buf='';
  while(true){var c=await rd.read();if(c.done){break}buf+=dec.decode(c.value,{stream:true});var parts=buf.split('\n\n');buf=parts.pop();parts.forEach(function(p){if(p.indexOf('data: ')===0){push(JSON.parse(p.slice(6)))}})}}
 catch(e){push({kind:'error',error:String(e)})}$('run').disabled=false}
$('run').addEventListener('click',run);
$('demo').addEventListener('change',function(){var d=DEMOS.find(function(x){return x.id===this.value},this);if(d){$('q').value=d.question;$('home').value=d.home;$('q').style.display='none'}else{$('q').style.display='';$('q').value='';$('q').focus()}});
async function replay(id){var res=await fetch('/runs/'+id);if(!res.ok){caption('That recorded run no longer exists','pick another from the list');return}var r=await res.json();$('q').value=r.question;$('home').value=r.home;start(r.question,r.home);(r.timeline||[]).filter(function(e){return e.kind!=='result'}).forEach(push);push({kind:'result',result:r})}
$('replay').addEventListener('change',function(){if(this.value){replay(this.value)}});
async function init(){$('steps').innerHTML='<span></span>'.repeat(9);resize();var cat=await (await fetch('/catalog')).json();cat.forEach(function(c){LABS[c.lab_id]=c});
 $('home').innerHTML=cat.map(function(c){return '<option value="'+c.lab_id+'">'+short(c.lab_id)+' · '+c.lab_id.split('_')[1]+'</option>'}).join('');DEMOS=await (await fetch('/demos')).json();var TITLES={'2':'Does Korean evidence transfer to US Asian patients?','6':'Is hypertension a stronger stroke marker in young adults?','5':'How many young adults with high readings are undiagnosed?'};$('demo').innerHTML+=DEMOS.map(function(d){return '<option value="'+d.id+'">'+(TITLES[d.id]||d.question.slice(0,60))+'</option>'}).join('');
 try{var runs=await (await fetch('/runs')).json();$('replay').innerHTML+=runs.slice(0,10).map(function(r){var t=r.run_id;return '<option value="'+t+'">'+t.slice(0,4)+'-'+t.slice(4,6)+'-'+t.slice(6,8)+' '+t.slice(9,11)+':'+t.slice(11,13)+' · '+short(r.home||'')+'</option>'}).join('')}catch(e){}
 if(PRESENT){document.body.classList.add('present')}start('',$('home').value);var u=new URLSearchParams(location.search);if(u.get('replay')){replay(u.get('replay'))}}
init();
</script>
